name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: abtest
          POSTGRES_PASSWORD: abtest
          POSTGRES_DB: abtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abtest -d abtest"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://abtest:abtest@localhost:5432/abtest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag, so pin the exact release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  sdk:
    name: SDK on Node ${{ matrix.node }} (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    # The SDK supports Node 22+ (PRD §12): test the floor and the current LTS.
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: sdk-js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk-js/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # Proves the M0 promise "fresh clone + make dev runs everything" on every push:
  # build every image from a clean checkout and wait until all services are healthy.
  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose up --build --detach --wait --wait-timeout 300
      - run: curl --fail --silent --show-error http://localhost:8000/health
      - run: curl --fail --silent --show-error --output /dev/null http://localhost:3000
      - run: curl --fail --silent --show-error --output /dev/null http://localhost:8080
      - if: failure()
        run: docker compose ps --all && docker compose logs
      - if: always()
        run: docker compose down --volumes
