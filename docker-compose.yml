# Local development stack. `make dev` runs `docker compose up --build --watch`:
# Compose Watch copies source changes into the running containers (see develop.watch),
# so nothing is bind-mounted and the stack behaves the same on any Docker runtime.
name: abtest

services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: applies migrations and bootstraps (default project, API keys, partitions),
  # then exits. The api and worker start only after it succeeds.
  migrate:
    build: &server-build
      context: ./server
      additional_contexts:
        migrations: ./db/migrations
    command: python -m abtest.db migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ABTEST_CLIENT_KEY: ${ABTEST_CLIENT_KEY}
      ABTEST_SERVER_KEY: ${ABTEST_SERVER_KEY}
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild # a new migration: rebuild and run again
          path: ./db/migrations

  api:
    build: *server-build
    command: uvicorn --factory abtest.api.app:create_app --host 0.0.0.0 --port 8000 --reload --reload-dir src
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Optional (.env.example); passed on only when set, so the API's defaults apply.
      RATE_LIMIT_PER_SECOND:
      RATE_LIMIT_BURST:
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    develop:
      watch:
        - action: sync # uvicorn --reload picks up the change
          path: ./server/src
          target: /app/src
        - action: rebuild # dependencies changed
          path: ./server/uv.lock

  worker:
    build: *server-build
    command: python -m abtest.worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync+restart # the worker has no reloader, so restart it
          path: ./server/src
          target: /app/src
        - action: rebuild # dependencies changed
          path: ./server/uv.lock

  web:
    build: ./web
    environment:
      ABTEST_API_URL: http://api:8000 # server-to-server, inside the compose network
      ABTEST_SERVER_KEY: ${ABTEST_SERVER_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 30s
      retries: 20
    develop:
      watch:
        - action: sync # next dev hot-reloads
          path: ./web
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild # dependencies changed
          path: ./web/package-lock.json

  demo:
    build:
      context: ./demo
      additional_contexts:
        sdk-src: ./sdk-js # the image builds the SDK and serves it next to the page
    environment:
      ABTEST_CLIENT_KEY: ${ABTEST_CLIENT_KEY}
      DEMO_API_URL: http://localhost:8000 # as the browser sees the API
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 10
    develop:
      watch:
        - action: sync
          path: ./demo/index.html
          target: /usr/share/nginx/html/index.html
        - action: rebuild # the SDK changed: rebuild it into the image
          path: ./sdk-js/src

volumes:
  pgdata:
