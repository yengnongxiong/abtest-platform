[project]
name = "abtest"
version = "0.1.0"
description = "abtest-platform server: API, worker, statistics engine, and simulator."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.13.1",
    "matplotlib>=3.11.2",
    "mmh3>=5.3.0",
    "numpy>=2.5.3",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "locust>=2.46.6",
    "mypy>=2.3.1",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "scipy-stubs>=1.18.1.1",
    "statsmodels>=0.15.0",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, ruff-specific.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
# loadtest/ holds the performance scripts (PRD §7); its modules import each other by name.
# ../scripts holds repo tools, such as the README screenshots.
files = ["src", "tests", "scripts", "../loadtest", "../scripts"]
mypy_path = "../loadtest"
plugins = ["pydantic.mypy"]

# statsmodels ships no type information. It is a test-only dependency, used to cross-check
# the stats engine.
[[tool.mypy.overrides]]
module = ["statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# ../loadtest: tests import the load-test scripts' modules. "no:locust": Locust (a dev
# dependency for the load test) registers a pytest plugin that these tests don't use.
pythonpath = ["../loadtest"]
addopts = ["-ra", "--strict-markers", "-p", "no:locust"]
